[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myproject"
version = "0.1.0"
description = "CodeSurgeon - AI-powered code analysis and fix generation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "CodeSurgeon Team", email = "team@codesurgeon.dev"}
]
keywords = ["code-analysis", "bug-detection", "ai", "llm", "github"]

dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.27.1",
    "pydantic==2.6.4",
    "anthropic==0.40.0",
    "loguru==0.7.2",
    "requests==2.31.0",
    "PyGithub==2.1.1",
    "python-dotenv==1.0.0",
    "openai==1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "black==24.4.2",
    "mypy==1.10.0",
    "locust==2.27.0",
    "pip-audit==2.7.3",
]

[project.urls]
Homepage = "https://github.com/yourorg/codesurgeon"
Documentation = "https://github.com/yourorg/codesurgeon/blob/main/README.md"
Repository = "https://github.com/yourorg/codesurgeon.git"
Issues = "https://github.com/yourorg/codesurgeon/issues"

[tool.setuptools]
packages = ["myproject"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --strict-markers --tb=short --junit-xml=reports/{name}_results.xml --cov=src/myproject --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage_html"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "user_stories: User story tests",
    "edge: Edge case tests",
    "load: Load tests",
]

[tool.coverage.run]
source = ["src/myproject"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
min_coverage = 70

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line-too-long (handled by black)
    "W503",  # line-break-before-binary-operator
    "B008",  # do-not-perform-function-calls-in-argument-defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F811"]

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "github.*",
    "loguru.*",
]
ignore_missing_imports = true
